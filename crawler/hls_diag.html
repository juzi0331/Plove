<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>HLS 播放诊断</title>
<style>
  body { background:#111; color:#eee; font-family:monospace; padding:16px; }
  video { width:480px; max-width:100%; background:#000; display:block; }
  #log { white-space:pre-wrap; font-size:12px; line-height:1.5; max-height:60vh; overflow:auto; background:#1a1a1a; padding:10px; margin-top:12px; border-radius:6px; }
  .ok { color:#4cd964; } .err { color:#ff5252; } .warn { color:#ffd21a; }
</style>
</head>
<body>
<h3 style="margin:4px 0 10px">hls.js 真机播放诊断</h3>
<video id="v" controls muted autoplay playsinline></video>
<div id="log"></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const TARGET = "https://yd-hls.tktjpm.cn/videos5/d83e0c3a0a31bd06384c590d9a07ab5c/d83e0c3a0a31bd06384c590d9a07ab5c.m3u8?auth_key=1790843086-215e6320797a2-0-43e88c07ee5fd2702b7528f71517900d&v=3&time=0&via=hgdj&via_bm=dx";
const logEl = document.getElementById('log');
const lines = [];
function log(msg, cls) {
  const t = (performance.now()/1000).toFixed(1);
  lines.push(`[${t}s] ${msg}`);
  logEl.innerHTML = lines.map(l => l.startsWith('[ERR')||l.includes('ERROR') ? `<span class="err">${l}</span>` : (l.includes('成功')||l.includes('PLAYING') ? `<span class="ok">${l}</span>` : l)).join('\n');
}
const video = document.getElementById('v');

if (!Hls.isSupported()) {
  log('hls.js 不支持此浏览器，尝试原生 HLS…', 'warn');
}
log('Hls.isSupported() = ' + Hls.isSupported());

if (video.canPlayType('application/vnd.apple.mpegurl')) {
  log('浏览器原生支持 HLS（Safari 系）', 'warn');
}

const hls = new Hls({ enableWorker: true });
hls.on(Hls.Events.MANIFEST_PARSED, (_e, d) => log(`MANIFEST_PARSED：${d.levels.length} 个画质档`));
hls.on(Hls.Events.LEVEL_LOADED, (_e, d) => log(`LEVEL_LOADED：details.live=${d.details.live}，分片 ${d.details.fragments.length} 个`));
hls.on(Hls.Events.FRAG_LOADED, (_e, d) => { if (d.frag.sn < 3 || d.frag.sn % 10 === 0) log(`FRAG_LOADED sn=${d.frag.sn} ${Math.round(d.stats.total/1024)}KB`); });
hls.on(Hls.Events.ERROR, (_e, data) => {
  const tag = data.fatal ? '[FATAL]' : '[warn]';
  log(`${tag} ${data.type}/${data.details} url=${(data.frag ? data.frag.url : data.url || '').slice(0,90)} response=${data.response ? data.response.code + ' ' + data.response.text : '-'}`);
  if (data.fatal) {
    switch (data.type) {
      case Hls.ErrorTypes.NETWORK_ERROR:
        log('网络致命错误 → startLoad() 重试', 'warn'); hls.startLoad(); break;
      case Hls.ErrorTypes.MEDIA_ERROR:
        log('媒体致命错误 → recoverMediaError()', 'warn'); hls.recoverMediaError(); break;
      default:
        log('不可恢复错误 → destroy()', 'err'); hls.destroy();
    }
  }
});
video.addEventListener('playing', () => log('▶ PLAYING：视频实际开始播放！'));
video.addEventListener('waiting', () => log('buffering…'));
video.addEventListener('error', () => log('<video> 元素错误：' + (video.error ? video.error.code : '?'), 'err'));

log('loadSource: ' + TARGET.slice(0, 90) + '…');
hls.loadSource(TARGET);
hls.attachMedia(video);
</script>
</body>
</html>

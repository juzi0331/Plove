# Plove 反向代理
#
# 放到 /etc/nginx/sites-available/plove，然后：
#   ln -s /etc/nginx/sites-available/plove /etc/nginx/sites-enabled/plove
#   nginx -t && systemctl reload nginx
# 证书用 certbot 自动签（见 CHECKLIST 第 7 步），它会自己改写下面的 ssl_* 行。

# 先把 http 全部跳到 https。
# **这一步不是可选的**：ipa 里的 WKWebView 默认拦截明文 http（ATS），
# 而且没有证书的话域名和 IP 就没差别 —— 那"只打包一次"的前提就没了。
server {
    listen 80;
    listen [::]:80;
    server_name plove.example.com;          # ← 换成你的域名

    # certbot 的验证目录要放行
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 的写法随 nginx 版本不同：
    #   1.25.1 以上： listen 443 ssl;  + 单独一行 ``http2 on;``
    #   1.25.1 以下： listen 443 ssl http2;
    # 下面默认用**旧写法**（虽然新版本会告警，但旧版本不会报错）。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plove.example.com;          # ← 换成你的域名

    # 下面几行由 certbot 自动填写/更新
    # ssl_certificate     /etc/letsencrypt/live/plove.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/plove.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 没有上传接口，把请求体压到最小
    client_max_body_size 1m;

    access_log /var/log/nginx/plove.access.log;
    error_log  /var/log/nginx/plove.error.log;

    # ---- API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 让 nginx 生成/透传 request id：它能和应用日志里的 request_id 对上。
        # 应用侧：没有这个头就自己生成一个（见 core/middleware.py）。
        proxy_set_header X-Request-Id      $request_id;

        # ⚠️ 超时必须**大于应用自己的最坏情况**，否则 nginx 会先把连接掐掉，
        # 你看到的是一张 nginx 的 504 HTML 页，而不是应用那个带 request_id 的
        # JSON 错误信封 —— 后者才能拿去找日志。
        #
        # 应用的算术：爬虫超时（25s）+ 排队（20s）= 单个请求最坏约 45s。
        # 75s 留了足够余量，同时不至于让一个卡死的请求占太久。
        proxy_connect_timeout 5s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;

        # 关掉缓冲，让错误立刻返回而不是攒着
        proxy_buffering off;

        # 这里是**不缓存**的（没有 proxy_cache），所以不需要处理 Cache-Control。
        # 缓存放在应用里做（内存 TTL + 防击穿），因为只有它知道
        # “哪些能缓存、哪些绝对不行”（比如带时效签名的播放地址）。
    }

    # ---- Swagger（上线后可以关：PLOVE_DOCS_ENABLED=false，那样这里会 404）----
    location /docs        { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }

    # ---- 前端静态文件（阶段 7 才开始用；现在 frontend/dist 还不存在）----
    # 前端是纯静态的，让 nginx 直接发比让 FastAPI 转发快得多，
    # 也不占后端那个唯一的 worker。
    #
    # root /opt/plove/frontend/dist;
    # index index.html;
    # location / {
    #     try_files $uri $uri/ /index.html;        # SPA 前端路由回退
    #     # 带哈希的构建产物可以长缓存
    #     location ~* \.(js|css|woff2?|png|jpg|svg)$ {
    #         expires 30d;
    #         add_header Cache-Control "public, immutable";
    #     }
    # }

    # 任何没匹配上的路径都别漏给后端
    location / {
        return 404;
    }
}

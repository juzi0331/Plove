<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Injecting Token...</title></head>
<body>
<script>
  // 从 URL 参数安全注入 token 用于本地调试，杜绝公网构建包中硬编码凭据
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const name = params.get('name') || 'Windows 桌面端';
  if (token) {
    localStorage.setItem('plove.device_token', token);
    localStorage.setItem('plove.device_name', name);
  }
  window.location.href = '/';
</script>
</body>
</html>

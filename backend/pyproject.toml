[project]
name = "plove-backend"
version = "0.1.0"
description = "Plove 后端网关：统一信封 + 契约 + 爬虫编排 + 激活码"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    # MySQL 驱动。线上是 MySQL，本地/测试用内存 SQLite，靠 SQLAlchemy 切换
    "pymysql>=1.1",
    # MySQL 8 默认的 caching_sha2_password 认证需要它，不装会连不上
    "cryptography>=42",
    "httpx[socks]>=0.27",
    "socksio>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx[socks]>=0.27",
    "socksio>=1.0.0",
    "jsonschema>=4.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "mysql: 需要真实 MySQL 的测试，未配 PLOVE_TEST_DATABASE_URL 时跳过",
]
